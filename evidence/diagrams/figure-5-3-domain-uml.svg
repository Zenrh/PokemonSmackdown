<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#334155" stroke-width="1.6"/></marker><marker id="triangle" markerWidth="15" markerHeight="15" refX="13" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="white" stroke="#334155" stroke-width="1.4"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="700" y="38" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#111111" text-anchor="middle">Battle domain UML and persistent record boundaries</text>
<rect x="30" y="85" width="620" height="200" rx="4" fill="#E9EFF5" stroke="#536273" stroke-width="2"/>
<path d="M30 134 H650" stroke="#536273" stroke-width="1.5"/>
<text x="340.0" y="118" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">BattleEngine</text>
<text x="47" y="168" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">- playerTeam: PokemonTeam</text>
<text x="47" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">- enemyTeam: PokemonTeam</text>
<text x="47" y="234" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">+ playerAttack(index), enemyAttack(index)</text>
<text x="47" y="267" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">+ switchPlayerPokemon(index), isBattleOver()</text>
<rect x="750" y="85" width="620" height="200" rx="4" fill="#E9EFF5" stroke="#536273" stroke-width="2"/>
<path d="M750 134 H1370" stroke="#536273" stroke-width="1.5"/>
<text x="1060.0" y="118" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">PokemonTeam</text>
<text x="767" y="168" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">- team: List&lt;Pokemon&gt;; activeIndex: int</text>
<text x="767" y="201" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">+ addPokemon(p), switchPokemon(index)</text>
<text x="767" y="234" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">+ getActivePokemon(), hasAvailablePokemon()</text>
<text x="767" y="267" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">+ getTeam(): immutable list snapshot</text>
<polyline points="650,180 750,180" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
<text x="663" y="153" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="start">2 roles</text>
<rect x="750" y="420" width="620" height="200" rx="4" fill="#E9EFF5" stroke="#536273" stroke-width="2"/>
<path d="M750 469 H1370" stroke="#536273" stroke-width="1.5"/>
<text x="1060.0" y="453" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">Pokemon</text>
<text x="767" y="503" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">- name, type, maxHP, currentHP</text>
<text x="767" y="536" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">- attack, defense, speed; moves: List&lt;Move&gt;</text>
<text x="767" y="569" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">+ addMove(move), takeDamage(amount), heal(n)</text>
<text x="767" y="602" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">+ isFainted(), getters</text>
<polyline points="1060,285 1060,420" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
<text x="1080" y="360" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="start">0..6 members</text>
<rect x="30" y="420" width="620" height="200" rx="4" fill="#E9EFF5" stroke="#536273" stroke-width="2"/>
<path d="M30 469 H650" stroke="#536273" stroke-width="1.5"/>
<text x="340.0" y="453" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">Move</text>
<text x="47" y="503" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">- name, type, power, accuracy</text>
<text x="47" y="536" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">- maxPP, currentPP</text>
<text x="47" y="569" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">+ useMove(): boolean</text>
<text x="47" y="602" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">+ restorePP(), getters</text>
<polyline points="750,520 650,520" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
<text x="675" y="495" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="start">0..4</text>
<rect x="30" y="760" width="620" height="170" rx="4" fill="#EAF4EA" stroke="#536273" stroke-width="2"/>
<path d="M30 809 H650" stroke="#536273" stroke-width="1.5"/>
<text x="340.0" y="793" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">SavedTeam record</text>
<text x="47" y="843" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">id, name, version, pokemonIds</text>
<text x="47" y="876" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">Immutable saved roster definition</text>
<text x="47" y="909" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">Does not store current battle HP or PP</text>
<rect x="750" y="760" width="620" height="170" rx="4" fill="#EAF4EA" stroke="#536273" stroke-width="2"/>
<path d="M750 809 H1370" stroke="#536273" stroke-width="1.5"/>
<text x="1060.0" y="793" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">BattleRecord record</text>
<text x="767" y="843" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">key, teamLabel, outcome, playerTurns</text>
<text x="767" y="876" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">startedAt, endedAt, playerIds, enemyIds</text>
<text x="767" y="909" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="start">Historical snapshots independent of saved teams</text>
<text x="30" y="980" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#111111" text-anchor="start">Pokemon and Move hold mutable battle state; saved records hold immutable ID lists.</text>
</svg>